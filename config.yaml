# ===================== 服务控制配置 =====================
# 以下为 subconverter 自身使用的配置，不会出现在输出的 Clash 配置中（合并前自动剥离）。
# 可直接访问 http://<本机>:5000/ui 在网页上编辑本文件（保存即热重载，无需重启）。
api_path: /api          # clash 软件获取订阅的接口路径（修改需重启进程）
# 访问密码：**只存哈希，不要填明文**。默认为空 = 未设置密码，
# 此时订阅接口一律拒绝；打开 /ui 在「访问密码」卡片里设置即可（也可再次清空）。
# 旧配置里若还留着明文 `password: xxx`，首次加载会自动改写成下面这行的哈希形式。
password_hash:
sub_url: https://a.c/subscribe1 # 默认机场订阅链接，可为空；为空时根据下方本地配置生成最小配置文件
sub_url1: https://a.c/subscribe2 # 备用订阅 1：客户端请求 ?sub_url=1 时使用（为空则回退 sub_url）
sub_url2: "" # 备用订阅 2：?sub_url=2
sub_url3: "" # 备用订阅 3：?sub_url=3
sub_url4: "" # 备用订阅 4：?sub_url=4
sub_url5: "" # 备用订阅 5：?sub_url=5
basic_auth: ""          # 动态更新 Home 节点 IP/端口 的基础认证，格式 username:password（可选）
server_url: ""          # 获取 Home 节点最新 IP/端口 的服务地址（可选，为空则不刷新）
cache_ttl: 60           # 缓存重新加载间隔（秒）：上次加载距今小于该值就直接用缓存，超过则触发重新加载
                        # 注意缓存本身「成功写入后永不过期」（并落盘到 sub_cache.json，重启不丢）；
                        # 本项只控制「多久去机场取一次」。请求触发加载后最多等 3 秒，超时用旧缓存返回。

# ===================== Clash 配置（本地为准，机场只提供代理节点） =====================
# 通用项（port / dns / keep-alive-interval 等）取自机场官方 Clash 配置（2026-09-16 拉取），
# 并参考「魔戒」机场配置补充了 fake-ip-filter 等通用项；代理组与代理规则为本地自定义。
# 机场的 proxies / proxy-groups / rules 一律不参与输出，机场只贡献「代理节点」，
# 由下方代理组里的 "*" 表达式指定插入位置。
#
# 转换规则：
#   - 输出的顶层 key 完全按本文件（顺序与内容），机场的顶层 key 不参与；
#   - proxies：本地节点 + 机场节点（按 name 去重，本地同名优先）；
#   - "*"：展开为机场带来的全部节点。YAML 中必须写成 - "*"（带引号），
#     裸写 - * 是 YAML 的别名（alias）语法，解析会直接失败；
#   - 想在输出中临时去掉某项，直接注释掉对应配置即可。

# --------------------- 端口 / 运行 ---------------------
port: 7890                    # HTTP 代理端口
socks-port: 7891              # SOCKS5 代理端口
# 机场另有 redir-port: 7892（Linux iptables 透明转发）与 mixed-port: 7893（HTTP+SOCKS 混合端口），
# 本机用不到故未启用；若客户端只支持混合端口，改用 mixed-port 并注释掉上面两行。
ipv6: false                   # 是否解析并允许 AAAA 记录（机场值 false）
udp: true                     # 允许 UDP 转发（QUIC / 游戏 / TUN 需要；机场未声明，本地保留）
allow-lan: true               # 是否允许局域网访问（机场值 false；路由器 / 共享场景需要 true）
bind-address: '*'             # 监听地址，配合 allow-lan（* = 所有网卡）
mode: rule                    # 运行模式：rule(规则) / global(全局) / direct(直连)
log-level: info               # 日志级别：silent / error / warning / info / debug
unified-delay: true           # 用「统一延迟」口径显示节点延迟
keep-alive-interval: 360      # TCP keep-alive 间隔（秒）
global-client-fingerprint: chrome   # 全局 TLS 指纹（伪装成 Chrome）
external-controller: 127.0.0.1:9090   # 控制端口（dashboard 用）；机场为 0.0.0.0:9090，本地收紧到仅本机

# --------------------- DNS（抄自机场） ---------------------
dns:
  enable: true
  listen: 127.0.0.1:5334      # DNS 监听端口（TUN / 其他设备指向本机时用）
  default-nameserver:         # 仅用于解析下方 nameserver 里的 DoH 域名，必须填 IP
    - 180.184.1.1
    - 119.29.29.29
    - 223.5.5.5
  enhanced-mode: fake-ip      # fake-ip：先返回假地址，拿到域名后再分流
  fake-ip-range: 198.18.0.1/16   # mihomo 默认段（魔戒用的是 28.0.0.1/8，需要时替换）
  use-hosts: true             # 启用本文件下方的 hosts 段
  use-system-hosts: true      # 同时读取系统 hosts
  # fake-ip-filter：以下域名不做 fake-ip 转换，直接返回真实解析结果。
  # 漏掉它们容易出现「NTP 对不上时间 / 音乐 App 打不开 / STUN 拿不到真实 IP / 局域网设备访问不了」。
  fake-ip-filter:
    # —— 局域网与保留域名
    - '*.lan'
    - '*.localdomain'
    - '*.example'
    - '*.invalid'
    - '*.localhost'
    - '*.test'
    - '*.local'
    - '*.home.arpa'
    # —— 时间同步（NTP 客户端必须拿到真实 IP）
    - time.*.com
    - time.*.gov
    - time.*.edu.cn
    - time.*.apple.com
    - time1.*.com
    - time2.*.com
    - time3.*.com
    - time4.*.com
    - time5.*.com
    - time6.*.com
    - time7.*.com
    - ntp.*.com
    - ntp1.*.com
    - ntp2.*.com
    - ntp3.*.com
    - ntp4.*.com
    - ntp5.*.com
    - ntp6.*.com
    - ntp7.*.com
    - '*.time.edu.cn'
    - '*.ntp.org.cn'
    - +.pool.ntp.org
    - time1.cloud.tencent.com
    # —— 音乐 / 视频平台（走 fake-ip 会无法播放或登录）
    - music.163.com
    - '*.music.163.com'
    - '*.126.net'
    - musicapi.taihe.com
    - music.taihe.com
    - songsearch.kugou.com
    - trackercdn.kugou.com
    - '*.kuwo.cn'
    - api-jooxtt.sanook.com
    - api.joox.com
    - joox.com
    - y.qq.com
    - '*.y.qq.com'
    - streamoc.music.tc.qq.com
    - mobileoc.music.tc.qq.com
    - isure.stream.qqmusic.qq.com
    - dl.stream.qqmusic.qq.com
    - aqqmusic.tc.qq.com
    - amobile.music.tc.qq.com
    - '*.xiami.com'
    - '*.music.migu.cn'
    - music.migu.cn
    # —— 系统连通性检测 / 系统更新
    - +.msftconnecttest.com
    - +.msftncsi.com
    - msftconnecttest.com
    - msftncsi.com
    - localhost.ptlogin2.qq.com
    - localhost.sec.qq.com
    - mesu.apple.com
    - swscan.apple.com
    - swquery.apple.com
    - swdownload.apple.com
    - swcdn.apple.com
    - swdist.apple.com
    - lens.l.google.com
    # —— 游戏平台 / STUN（P2P 打洞需要真实 IP）
    - +.srv.nintendo.net
    - +.stun.playstation.net
    - xbox.*.microsoft.com
    - xnotify.xboxlive.com
    - +.ipv6.microsoft.com
    - +.battlenet.com.cn
    - +.wotgame.cn
    - +.wggames.cn
    - +.wowsgame.cn
    - +.wargaming.net
    - proxy.golang.org
    - stun.*.*
    - stun.*.*.*
    - +.stun.*.*
    - +.stun.*.*.*
    - +.stun.*.*.*.*
    - stun.l.google.com
    - '*.square-enix.com'
    - '*.finalfantasyxiv.com'
    - '*.ffxiv.com'
    - '*.ff14.sdo.com'
    - ff.dorado.sdo.com
    - '*.mcdn.bilivideo.cn'
    - +.media.dssott.com
    - +.pvp.net
    # —— 路由器 / 网关管理页
    - heartbeat.belkin.com
    - '*.linksys.com'
    - '*.linksyssmartwifi.com'
    - '*.router.asus.com'
  nameserver-policy:          # 按域名指定 DNS：国内 / 私有域名走国内解析
    geosite:cn,private:
      - 119.29.29.29
      - 223.5.5.5
      - system
  nameserver:                 # 其余域名走加密 DNS（DoH）；后两条明文 IP 作兜底（DoH 域名解析失败时仍可用）
    - https://223.6.6.6/dns-query
    - https://doh.pub/dns-query
    - 119.29.29.29
    - 223.5.5.5
  proxy-server-nameserver:    # 专门解析代理节点服务器地址；不能走代理，否则死循环
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  # 说明：魔戒配置里另有 fallback / fallback-filter，但它给的 fallback 与 nameserver 是同一批国内
  # DNS，起不到「国外 DNS 交叉验证防污染」的作用；mihomo 现已推荐用 proxy-server-nameserver +
  # nameserver-policy 替代，故本模板不启用。另：魔戒的 dns.ipv6: true 与本文件顶层 ipv6: false
  # 冲突，两者需保持一致，此处跟随顶层保持不返回 AAAA。
experimental:
  ignore-resolve-fail: true   # DNS 解析失败时忽略，避免因解析失败直接断连（本地补充）
hosts:                        # 强制指定解析结果（不改变 DNS 行为，仅本机生效；本地补充）
  'mtalk.google.com': 108.177.125.188
  'services.googleapis.cn': 74.125.203.94

# 机场配置里另有 clash-for-android（Android 客户端专用）、cfw-bypass（Clash for Windows 专用）、
# ntp（NTP 时间同步）三段，属特定客户端 / 特定平台，本机用不到，故未抄录。

# --------------------- 代理节点（本地节点；机场节点由 "*" 表达式插入） ---------------------
proxies:
  - name: Home   # 占位值；配置 server_url 后每次请求都会刷新为最新 IP / 端口
    type: ss
    server: 11.11.11.11
    port: 11
    cipher: aes-256-gcm
    password: 1234
    udp: true

# --------------------- 代理组（全部本地定义，机场的组一律丢弃） ---------------------
# 书写顺序 = 客户端 UI 里的显示顺序。"*" 展开为机场带来的全部节点（本地节点不参与展开）。
proxy-groups:
  - name: 🚀 节点选择   # 手动挑选：机场节点 + 自动选择
    type: select
    proxies:
      - ♻️ 自动选择
      - "*"
  - name: ♻️ 自动选择   # 自动选延迟最低的机场节点
    type: url-test
    proxies:
      - "*"
    url: http://www.google-analytics.com/generate_204   # 探测地址（同机场）
    interval: 300   # 探测间隔（秒）
    tolerance: 50   # 延迟差在此范围内不切换，避免抖动
  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - ♻️ 自动选择
  - name: 🐟 漏网之鱼   # 兜底：未命中任何规则的流量
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
  - name: 🏠 回家   # 回家 / 内网：默认走 Home 本地节点
    type: select
    proxies:
      - Home
      - 内网
      - 🚀 节点选择
      - DIRECT
rules:
  - GEOSITE,CN,DIRECT
  - GEOIP,CN,DIRECT
  - GEOIP,HK,DIRECT
  - GEOIP,LAN,DIRECT
  - MATCH,🐟 漏网之鱼
